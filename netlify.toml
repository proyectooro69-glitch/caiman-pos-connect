[build]
  # 1. Entra a client. 2. Instala. 3. Construye. 4. Saca el contenido de dist a la raíz.
  command = "cd client && npm install && npm run build && cp -r dist/. ../dist_root"
  # Le decimos a Netlify que busque en esa nueva carpeta en la raíz
  publish = "dist_root"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
