[build]
  # Entramos a client, construimos, y movemos la carpeta dist hacia AFUERA (a la raíz)
  command = "cd client && npm install && npm run build && mv dist ../dist"
  # Ahora le decimos que publique la carpeta dist que acabamos de sacar a la raíz
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
