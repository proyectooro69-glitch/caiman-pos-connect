[build]
  # Entramos a la carpeta de la app
  base = "client"
  # Instalamos y construimos
  command = "npm install && npm run build"
  # Publicamos la carpeta que Vite acaba de crear AQUÍ MISMO
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
