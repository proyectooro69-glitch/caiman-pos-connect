[build]
  # Netlify entra aquí primero
  base = "client"
  # Ejecuta el build dentro de client
  command = "npm install && npm run build"
  # Como ya estamos dentro de 'client', la carpeta de salida es solo 'dist'
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
