[build]
  # Comando simple: entra y construye. No intentamos mover nada.
  command = "cd client && npm install && npm run build"
  # Esta es la ruta exacta donde el log mostró que se crearon los archivos
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
