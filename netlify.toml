[build]
  # Ya sabemos que Netlify entra aquí correctamente
  base = "client"
  command = "npm install && npm run build"
  # AQUÍ ESTÁ EL CAMBIO: Solo dist, sin el prefijo 'client/'
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
