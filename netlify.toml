[build]
  # 'base' le dice a Netlify que ignore la raíz y trabaje solo dentro de 'client'
  base = "client"
  command = "npm install && npm run build"
  # Ahora 'dist' se refiere correctamente a 'client/dist'
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
