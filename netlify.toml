[build]
  # Forzamos la instalación y el build desde la raíz apuntando a client
  command = "npm install --prefix client && npm run build --prefix client"
  # Probamos con la ruta relativa simple
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
